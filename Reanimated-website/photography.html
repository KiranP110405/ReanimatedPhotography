<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            margin: 0px;
            background-color: #0D0A14;
        }

        header {
            display: flex;
            justify-content: space-between;
            background-color: darkgray;
            padding: 10px;
            box-shadow: 0 10px 4px 0 rgba(0, 0, 0, .2);
            position: relative;
        }

        .nav-links {
            display: flex;
            justify-content: space-between;
        }

        .gallery-hero {
            color: white;
            margin: 20px;
        }

        .photography-gallery {
            display: grid;
            grid-template-columns: 1fr 1fr;

            column-gap: 40px;
            row-gap: 40px;

            width: 85%;
            max-width: 1200px;
            margin: 0 auto;
        }

        .gallery-item {
            width: 100%;
            height: 450px;
            overflow: hidden;
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
    </style>
</head>

<body>
    <header>
        <h1>Reanimated</h1>
        <nav>
            <ul class="nav-links">
                <ul><a href="#work">Work</a></ul>
                <ul><a href="#services">Services</a></ul>
                <ul><a href="#about">About</a></ul>
                <ul><a href="#contact">Contact</a></ul>
            </ul>
        </nav>
    </header>
    <main>
        <section class="gallery-hero">
            <p>Portfolio / Photography</p>
            <h1>Photography.</h1>
            <p class="gallery-description">
                A selection of portraits, events and moments captured through
                the lens.
            </p>
        </section>
        <section class="photography-gallery">

            <div class="gallery-item">
                <img src="images/test.jpg" alt="Photography project">
            </div>

            <div class="gallery-item">
                <img src="images/test.jpg" alt="Photography project">
            </div>

            <div class="gallery-item">
                <img src="images/test.jpg" alt="Photography project">
            </div>

            <div class="gallery-item">
                <img src="images/test.jpg" alt="Photography project">
            </div>

            <div class="gallery-item">
                <img src="images/test.jpg" alt="Photography project">
            </div>

            <div class="gallery-item">
                <img src="images/test.jpg" alt="Photography project">
            </div>

            <div class="gallery-item">
                <img src="images/test.jpg" alt="Photography project">
            </div>

            <div class="gallery-item">
                <img src="images/test.jpg" alt="Photography project">
            </div>

        </section>
    </main>
</body>

</html>
