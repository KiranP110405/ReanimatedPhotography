<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    body {
        margin: 0px;
    }

    header {
        display: flex;
        justify-content: space-between;
        background-color: darkgray;
        padding: 10px;
        box-shadow: 0 10px 4px 0 rgba(0, 0, 0, .2);
        position: relative;
    }

    .nav-links {
        display: flex;
        justify-content: space-between;
    }

    /* Container holding the image and the text */
    .container {
        position: relative;
        text-align: center;
        color: white;
    }

    /* Top left text */
    .subheading {
        margin-top: 210px;
        position: absolute;
        top: 8px;
        left: 16px;
        text-align: start;
        font-size: 4vh;
    }
</style>

<body>
    <header>
        <h1>Reanimated</h1>
        <nav>
            <ul class="nav-links">
                <ul><a href="#work">Work</a></ul>
                <ul><a href="#services">Services</a></ul>
                <ul><a href="#about">About</a></ul>
                <ul><a href="#contact">Contact</a></ul>
            </ul>
        </nav>
    </header>
    <main>
        <section id="hero-section">
            <div class="container">
                <img src="images/test.jpg" alt="Snow" style="width:100%;">
                <div class="subheading">Moments fade.<br> We bring them back to life.</div>
            </div>
        </section>
    </main>
    <footer>

    </footer>
</body>

</html>
